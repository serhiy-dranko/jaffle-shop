models:
  - name: int_orders_joined
    description: "Intermediate model that joins orders with customer and payment information."
    columns:
      - name: order_id
        description: "Primary key. Unique identifier for an order."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key. Links to the customer who placed the order."
        tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: order_date
        description: "The date the order was placed."
        tests:
          - not_null
      - name: order_status
        description: "The status of the order."
        tests:
          - not_null
          - accepted_values:
              values: ['returned', 'completed', 'return_pending', 'shipped', 'placed']
      - name: total_amount
        description: "Joined Total payment amount for the order."
        tests:
          - not_null
