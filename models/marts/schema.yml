models:
  - name: dim_customers
    description: "One row per customer, with calculated attributes like full name."
    columns:
      - name: customer_id
        description: "Primary key. Unique identifier for a customer."
        tests:
          - unique
          - not_null
      - name: first_name
        description: "The customer's first name."
      - name: last_name
        description: "The customer's last name."
      - name: full_name
        description: "Concatenated first and last name."

  - name: fct_orders
    description: "One row per order, with total payment amount and customer link."
    columns:
      - name: surrogate_key
        description: "A unique identifier for each order."
        tests:
          - not_null
      - name: order_id
        description: "Primary key. Unique identifier for an order."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key. Links to the customer who placed the order."
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: "The date the order was placed."
        tests:
          - not_null
      - name: total_amount
        description: "Total payment amount for the order."
        tests:
          - not_null
          - dbt_utils.not_constant
          - dbt_utils.expression_is_true:
              expression: ">= 0"
    
  - name: practice_jinja
    description: "A practice model for testing purposes."
    columns:
      - name: order_id
        description: "Primary key. Unique identifier for an order."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key. Links to the customer who placed the order."
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: "The date the order was placed."
        tests:
          - not_null
      - name: order_status
        description: "The status of the order."
        tests:
          - not_null
          - accepted_values:
              values: ['returned', 'completed', 'return_pending', 'shipped', 'placed']
      - name: total_amount
        description: "Total payment amount for the order."
        tests:
          - not_null

  - name: price_change_history
    description: "A model that tracks the history of price changes for products."
    columns:
      - name: product_id
        description: "Primary key. Unique identifier for a product."
        tests:
          - not_null
      - name: product_name
        description: "The name of the product."
      - name: current_price
        description: "The current price of the product."
        tests:
          - not_null
      - name: previous_price
        description: "The previous price of the product."
      - name: price_change_amount
        description: "The amount by which the price has changed."
      - name: price_change_percentage
        description: "The percentage change in price."
      - name: changed_at
        description: "The date when the price change occurred."
      - name: days_at_this_price
        description: "The number of days the product has been at the current price."