models:
  - name: stg_customers
    description: "One row per customer. Standardizes column names from the raw customers source."
    columns:
      - name: customer_id
        description: "Primary key, unique per customer."
        tests:
          - unique
          - not_null
      - name: first_name
        description: "The customer's first name."
      - name: last_name
        description: "The customer's last name."   

  - name: stg_orders
    description: "One row per order. Standardizes column names from the raw orders source."
    columns:
      - name: order_id
        description: "Primary key. Unique identifier for an order."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key. Links to the customer who placed the order."
      - name: order_date
        description: "The date the order was placed."
        tests:
          - not_null
      - name: order_status
        description: "The status of the order."
        tests:
          - accepted_values:
              values: ['returned', 'completed', 'return_pending', 'shipped', 'placed']

  - name: stg_payments
    description: "One row per payment. Standardizes column names from the raw payments source."
    columns:
      - name: payment_id
        description: "Primary key. Unique identifier for a payment."
        tests:
          - not_null
      - name: order_id
        description: "Foreign key. Links to the order associated with the payment."
      - name: amount
        description: "The amount paid in the payment."
      - name: payment_method
        description: "The method used for the payment (e.g., credit card, PayPal)"

  - name: stg_product_prices
    description: "One row per product price. Standardizes column names from the raw product prices source."
    columns:
      - name: product_id
        description: "Primary key. Unique identifier for a product."
        tests:
          - unique
          - not_null
      - name: product_name
        description: "The name of the product."
      - name: valid_from
        description: "The date from which the product price is valid."
      - name: price
        description: "The price of the product."
        tests:
          - not_null
